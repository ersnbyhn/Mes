<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Mobil cihazlarda otomatik yakınlaşmayı ve sayfa kaymasını tamamen engeller -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>2026 Mesai Takibi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Sayfanın taşmasını ve büyümesini engeller */
      position: fixed; /* Mobilde klavye açıldığında sayfanın kaymasını kilitler */
      background-color: #f4f6f8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 95vh;
      background: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none !important;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* 12 Ay Listesi - Sayfaya Tam Ortalanmış Yapı */
    #monthsView {
      justify-content: center;
    }

    .months-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      justify-content: center; /* Ayları dikeyde tam ortalar */
    }

    .month-btn {
      flex: 1;
      max-height: 45px;
      padding: 0 15px;
      background: #fff;
      border: 2px solid #333;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-radius: 4px;
    }

    .month-btn:active {
      background-color: #e0e0e0;
    }

    .month-hours-badge {
      font-size: 15px;
      font-weight: bold;
      color: #000;
    }

    /* Takvim Header */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    #backBtn {
      padding: 5px 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    /* Haftalık Başlıklar ve Takvim Izgarası */
    .weekdays-grid, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .weekdays-grid {
      flex-shrink: 0;
    }

    .weekdays-grid div {
      background: #7f8c8d;
      color: white;
      padding: 4px 0;
      font-size: 11px;
      font-weight: bold;
    }

    .days-grid {
      flex: 1;
      grid-template-rows: repeat(6, 1fr);
    }

    .day-cell {
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      overflow: hidden;
    }

    .day-number {
      font-size: 10px;
      padding: 1px 2px;
      background: #f9f9f9;
      text-align: left;
    }

    /* iOS & Android klavye odaklanmasında otomatik zoom yapmayı önleyen CSS ayarları */
    .day-input {
      width: 100%;
      border: none;
      text-align: center;
      font-size: 16px !important; /* Minimum 16px zoom'u engeller */
      font-weight: bold;
      padding: 2px 0;
      background: #88d498;
      outline: none;
      -webkit-text-size-adjust: 100%;
    }

    /* Toplam Mesai Alanı */
    .total-bar {
      margin-top: 8px;
      background: #4caf50;
      color: white;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      border-radius: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 12 AY SEÇİM EKRANI -->
  <div id="monthsView" class="container">
    <h2>2026 MESAİ</h2>
    <div id="monthsGrid" class="months-grid"></div>
  </div>

  <!-- AY DETAY / TAKVİM EKRANI -->
  <div id="calendarView" class="container hidden">
    <div class="header-nav">
      <button id="backBtn">← Geri</button>
      <h2 id="currentMonthTitle" style="margin-bottom:0;">AY</h2>
      <div style="width: 45px;"></div>
    </div>

    <!-- Gün Başlıkları (Pt - Pz) -->
    <div class="weekdays-grid">
      <div>Pt</div><div>Sa</div><div>Ça</div><div>Pe</div><div>Cu</div><div>Ct</div><div>Pz</div>
    </div>

    <!-- Takvim Günleri ve Mesai Girdileri -->
    <div id="daysGrid" class="days-grid"></div>

    <!-- Toplam Mesai Görünümü -->
    <div class="total-bar">
      <span>Toplam Mesai: </span>
      <span id="totalHours">0</span> Saat
    </div>
  </div>

  <script>
    const monthNames = [
      "OCAK", "ŞUBAT", "MART", "NİSAN", "MAYIS", "HAZİRAN",
      "TEMMUZ", "AĞUSTOS", "EYLÜL", "EKİM", "KASIM", "ARALIK"
    ];

    const year = 2026;
    let selectedMonthIndex = 0;

    const monthsView = document.getElementById("monthsView");
    const calendarView = document.getElementById("calendarView");
    const monthsGrid = document.getElementById("monthsGrid");
    const daysGrid = document.getElementById("daysGrid");
    const currentMonthTitle = document.getElementById("currentMonthTitle");
    const totalHours = document.getElementById("totalHours");
    const backBtn = document.getElementById("backBtn");

    function renderMonthsList() {
      monthsGrid.innerHTML = "";
      monthNames.forEach((month, index) => {
        const btn = document.createElement("div");
        btn.className = "month-btn";

        const titleSpan = document.createElement("span");
        titleSpan.innerText = month;

        const hoursSpan = document.createElement("span");
        hoursSpan.className = "month-hours-badge";
        
        const monthlyTotal = getMonthTotalHours(index);
        hoursSpan.innerText = monthlyTotal > 0 ? monthlyTotal : "";

        btn.appendChild(titleSpan);
        btn.appendChild(hoursSpan);

        btn.onclick = () => openMonth(index);
        monthsGrid.appendChild(btn);
      });
    }

    function openMonth(index) {
      selectedMonthIndex = index;
      currentMonthTitle.innerText = monthNames[index];
      monthsView.classList.add("hidden");
      calendarView.classList.remove("hidden");
      renderCalendar(index);
    }

    backBtn.onclick = () => {
      calendarView.classList.add("hidden");
      monthsView.classList.remove("hidden");
      renderMonthsList();
    };

    function renderCalendar(monthIndex) {
      daysGrid.innerHTML = "";
      
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      let firstDay = new Date(year, monthIndex, 1).getDay();
      firstDay = (firstDay === 0) ? 6 : firstDay - 1;

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day-cell";
        emptyCell.style.background = "#eee";
        daysGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";

        const numSpan = document.createElement("span");
        numSpan.className = "day-number";
        numSpan.innerText = day;

        const input = document.createElement("input");
        input.type = "number";
        input.step = "0.5";
        input.className = "day-input";

        const storageKey = `mesai_${year}_${monthIndex}_${day}`;
        input.value = localStorage.getItem(storageKey) || "";

        input.oninput = () => {
          localStorage.setItem(storageKey, input.value);
          calculateTotal(monthIndex, daysInMonth);
        };

        cell.appendChild(numSpan);
        cell.appendChild(input);
        daysGrid.appendChild(cell);
      }

      calculateTotal(monthIndex, daysInMonth);
    }

    function getMonthTotalHours(monthIndex) {
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      let total = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const val = localStorage.getItem(`mesai_${year}_${monthIndex}_${day}`);
        if (val) total += parseFloat(val);
      }
      return total;
    }

    function calculateTotal(monthIndex, daysInMonth) {
      const total = getMonthTotalHours(monthIndex);
      totalHours.innerText = total;
    }

    renderMonthsList();
  </script>
</body>
</html>
