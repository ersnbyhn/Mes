<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Mobil cihazlarda otomatik yakınlaşmayı ve sayfa kaymasını engeller -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>2026 Mesai Takibi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #f4f6f8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      overflow-y: auto; /* Sayfanın maaş tablosuyla rahatça sığması için dikey kaydırma */
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    h2 {
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* --- 1. SAYFA: TAM ORTALANMIŞ AYLAR --- */
    #monthsView {
      min-height: 85vh;
      justify-content: center;
      align-items: center;
    }

    #monthsView h2 {
      width: 100%;
      margin-bottom: 15px;
    }

    .months-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .month-btn {
      height: 40px;
      padding: 0 15px;
      background: #fff;
      border: 2px solid #333;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-radius: 4px;
    }

    .month-btn:active {
      background-color: #e0e0e0;
    }

    .month-hours-badge {
      font-size: 14px;
      font-weight: bold;
      color: #000;
    }

    /* --- 2. SAYFA: TAKVİM VE MAAŞ HESAPLAMA --- */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    #backBtn {
      padding: 5px 10px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      margin-bottom: 2px;
      flex-shrink: 0;
    }

    .weekdays-grid div {
      background: #7f8c8d;
      color: white;
      padding: 4px 0;
      font-size: 11px;
      font-weight: bold;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day-cell {
      height: 52px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
      border-radius: 3px;
      overflow: hidden;
    }

    .day-number {
      font-size: 10px;
      padding: 1px 3px;
      background: #f1f1f1;
      text-align: left;
      font-weight: bold;
      color: #333;
    }

    .day-input {
      width: 100%;
      height: 32px;
      border: none;
      text-align: center;
      font-size: 16px !important;
      font-weight: bold;
      background: #88d498;
      outline: none;
      -webkit-text-size-adjust: 100%;
    }

    .total-bar {
      margin-top: 10px;
      background: #4caf50;
      color: white;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 15px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* --- MAAŞ HESAPLAMA TABLOSU --- */
    .salary-calc-card {
      margin-top: 15px;
      padding: 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .calc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .calc-row span.label {
      width: 130px;
    }

    .calc-row span.colon {
      margin-right: 8px;
    }

    .calc-row input {
      flex: 1;
      max-width: 120px;
      padding: 4px 6px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: right;
      outline: none;
    }

    .calc-row .readonly-val {
      flex: 1;
      max-width: 120px;
      text-align: right;
      padding: 4px 6px;
      font-size: 15px;
      font-weight: bold;
      color: #2c3e50;
    }

    .net-salary-box {
      margin-top: 6px;
      padding: 8px;
      background: #27ae60;
      color: #fff;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 12 AY SEÇİM EKRANI -->
  <div id="monthsView" class="container">
    <h2>2026 MESAİ</h2>
    <div id="monthsGrid" class="months-grid"></div>
  </div>

  <!-- AY DETAY / TAKVİM VE HESAPLAMA EKRANI -->
  <div id="calendarView" class="container hidden">
    <div class="header-nav">
      <button id="backBtn">← Geri</button>
      <h2 id="currentMonthTitle" style="margin-bottom:0;">AY</h2>
      <div style="width: 45px;"></div>
    </div>

    <!-- Gün Başlıkları (Pt - Pz) -->
    <div class="weekdays-grid">
      <div>Pt</div><div>Sa</div><div>Ça</div><div>Pe</div><div>Cu</div><div>Ct</div><div>Pz</div>
    </div>

    <!-- Takvim Günleri ve Mesai Girdileri -->
    <div id="daysGrid" class="days-grid"></div>

    <!-- Toplam Mesai Görünümü -->
    <div class="total-bar">
      <span>Toplam Mesai: </span>
      <span id="totalHours">0</span> Saat
    </div>

    <!-- RESİMDEKİ MAAŞ HESAPLAMA TABLOSU -->
    <div class="salary-calc-card">
      <div class="calc-row">
        <span class="label">Saat Ücreti</span>
        <span class="colon">:</span>
        <input type="number" id="hourlyRate" value="400" step="1">
      </div>

      <div class="calc-row">
        <span class="label">Çalışma saati</span>
        <span class="colon">:</span>
        <div class="readonly-val" id="workHoursVal">225</div>
      </div>

      <div class="calc-row">
        <span class="label">Mesai</span>
        <span class="colon">:</span>
        <div class="readonly-val" id="overtimeHoursVal">0</div>
      </div>

      <div class="calc-row">
        <span class="label">Avans</span>
        <span class="colon">:</span>
        <input type="number" id="advanceVal" value="0" step="50">
      </div>

      <div class="calc-row">
        <span class="label">Sendika Aidat</span>
        <span class="colon">:</span>
        <input type="number" id="unionFeeVal" value="1500" step="10">
      </div>

      <div class="calc-row">
        <span class="label">Vergi Dilimi</span>
        <span class="colon">:</span>
        <div style="display: flex; align-items: center; gap: 2px;">
          <span>%</span>
          <input type="number" id="taxRateVal" value="27" step="1" style="width: 60px;">
        </div>
      </div>

      <div class="net-salary-box">
        <span>Tahmini Net Maaş:</span>
        <span id="netSalaryResult">0 TL</span>
      </div>
    </div>
  </div>

  <script>
    const monthNames = [
      "OCAK", "ŞUBAT", "MART", "NİSAN", "MAYIS", "HAZİRAN",
      "TEMMUZ", "AĞUSTOS", "EYLÜL", "EKİM", "KASIM", "ARALIK"
    ];

    const year = 2026;
    let selectedMonthIndex = 0;

    const monthsView = document.getElementById("monthsView");
    const calendarView = document.getElementById("calendarView");
    const monthsGrid = document.getElementById("monthsGrid");
    const daysGrid = document.getElementById("daysGrid");
    const currentMonthTitle = document.getElementById("currentMonthTitle");
    const totalHours = document.getElementById("totalHours");
    const backBtn = document.getElementById("backBtn");

    // Maaş alanları elemanları
    const hourlyRateInput = document.getElementById("hourlyRate");
    const workHoursVal = document.getElementById("workHoursVal");
    const overtimeHoursVal = document.getElementById("overtimeHoursVal");
    const advanceValInput = document.getElementById("advanceVal");
    const unionFeeValInput = document.getElementById("unionFeeVal");
    const taxRateValInput = document.getElementById("taxRateVal");
    const netSalaryResult = document.getElementById("netSalaryResult");

    // Kayıtlı maaş parametrelerini yükle
    function loadSavedSalaryConfig() {
      if (localStorage.getItem("salary_hourlyRate")) {
        hourlyRateInput.value = localStorage.getItem("salary_hourlyRate");
      }
      if (localStorage.getItem("salary_advance")) {
        advanceValInput.value = localStorage.getItem("salary_advance");
      }
      if (localStorage.getItem("salary_unionFee")) {
        unionFeeValInput.value = localStorage.getItem("salary_unionFee");
      }
      if (localStorage.getItem("salary_taxRate")) {
        taxRateValInput.value = localStorage.getItem("salary_taxRate");
      }
    }

    // Maaş girdisi değiştiğinde kaydet ve hesapla
    [hourlyRateInput, advanceValInput, unionFeeValInput, taxRateValInput].forEach(input => {
      input.oninput = () => {
        localStorage.setItem("salary_hourlyRate", hourlyRateInput.value);
        localStorage.setItem("salary_advance", advanceValInput.value);
        localStorage.setItem("salary_unionFee", unionFeeValInput.value);
        localStorage.setItem("salary_taxRate", taxRateValInput.value);
        calculateSalary();
      };
    });

    function renderMonthsList() {
      monthsGrid.innerHTML = "";
      monthNames.forEach((month, index) => {
        const btn = document.createElement("div");
        btn.className = "month-btn";

        const titleSpan = document.createElement("span");
        titleSpan.innerText = month;

        const hoursSpan = document.createElement("span");
        hoursSpan.className = "month-hours-badge";
        
        const monthlyTotal = getMonthTotalHours(index);
        hoursSpan.innerText = monthlyTotal > 0 ? monthlyTotal : "";

        btn.appendChild(titleSpan);
        btn.appendChild(hoursSpan);

        btn.onclick = () => openMonth(index);
        monthsGrid.appendChild(btn);
      });
    }

    function openMonth(index) {
      selectedMonthIndex = index;
      currentMonthTitle.innerText = monthNames[index];
      monthsView.classList.add("hidden");
      calendarView.classList.remove("hidden");
      renderCalendar(index);
    }

    backBtn.onclick = () => {
      calendarView.classList.add("hidden");
      monthsView.classList.remove("hidden");
      renderMonthsList();
    };

    function renderCalendar(monthIndex) {
      daysGrid.innerHTML = "";
      
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      let firstDay = new Date(year, monthIndex, 1).getDay();
      firstDay = (firstDay === 0) ? 6 : firstDay - 1;

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.className = "day-cell";
        emptyCell.style.background = "#eee";
        emptyCell.style.border = "none";
        daysGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.className = "day-cell";

        const numSpan = document.createElement("span");
        numSpan.className = "day-number";
        numSpan.innerText = day;

        const input = document.createElement("input");
        input.type = "number";
        input.step = "0.5";
        input.className = "day-input";

        const storageKey = `mesai_${year}_${monthIndex}_${day}`;
        input.value = localStorage.getItem(storageKey) || "";

        input.oninput = () => {
          localStorage.setItem(storageKey, input.value);
          calculateTotal(monthIndex, daysInMonth);
        };

        cell.appendChild(numSpan);
        cell.appendChild(input);
        daysGrid.appendChild(cell);
      }

      calculateTotal(monthIndex, daysInMonth);
    }

    function getMonthTotalHours(monthIndex) {
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      let total = 0;
      for (let day = 1; day <= daysInMonth; day++) {
        const val = localStorage.getItem(`mesai_${year}_${monthIndex}_${day}`);
        if (val) total += parseFloat(val);
      }
      return total;
    }

    function calculateTotal(monthIndex, daysInMonth) {
      const total = getMonthTotalHours(monthIndex);
      totalHours.innerText = total;
      overtimeHoursVal.innerText = total;

      // Ayın gün sayısına göre standart Çalışma Saati Belirleme
      // 31 Gün: 232.5 | 30 Gün: 225 | 28/29 Gün: (gün sayısı * 7.5)
      let standardWorkHours = daysInMonth === 31 ? 232.5 : (daysInMonth === 30 ? 225 : daysInMonth * 7.5);
      workHoursVal.innerText = standardWorkHours;

      calculateSalary();
    }

    function calculateSalary() {
      const rate = parseFloat(hourlyRateInput.value) || 0;
      const workHours = parseFloat(workHoursVal.innerText) || 0;
      const overtime = parseFloat(overtimeHoursVal.innerText) || 0;
      const advance = parseFloat(advanceValInput.value) || 0;
      const unionFee = parseFloat(unionFeeValInput.value) || 0;
      const taxRate = parseFloat(taxRateValInput.value) || 0;

      // Brüt Kazanç (Normal Çalışma + Mesai %50 zamlı kabul edilmiştir)
      const grossIncome = (workHours + (overtime * 1.5)) * rate;

      // Vergi Kesintisi
      const taxAmount = grossIncome * (taxRate / 100);

      // Ele Geçen Net Tutar
      const net = grossIncome - taxAmount - advance - unionFee;

      netSalaryResult.innerText = `${Math.round(net).toLocaleString('tr-TR')} TL`;
    }

    loadSavedSalaryConfig();
    renderMonthsList();
  </script>
</body>
</html>
